name: orgpad
description: A plain text editor built on Org mode.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE-Spleen.txt
    - assets/icon/orgpad.png
  fonts:
    # Spleen 8x16 by Frederic Cambus (BSD 2-Clause), converted to outlines by
    # tool/build_font.py so it renders as crisp pixels at 16 px.
    - family: Spleen
      fonts:
        - asset: assets/fonts/Spleen-Regular.ttf
        - asset: assets/fonts/Spleen-Bold.ttf
          weight: 700
