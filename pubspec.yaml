name: haruspex
description: A plain text editor built on Org mode.
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NOTICE-PCDOS.txt
    - assets/icon/haruspex.png
    - assets/icon/haruspex.svg
  fonts:
    # The IBM PC DOS 2000 ISO 9241-3 text mode font (8x16), converted to
    # outlines by tool/build_font.py so it renders as crisp pixels at 16 px.
    - family: PC DOS
      fonts:
        - asset: assets/fonts/PCDOS-Regular.ttf
        - asset: assets/fonts/PCDOS-Bold.ttf
          weight: 700
