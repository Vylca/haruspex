name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Generate Linux runner
        run: flutter create --platforms=linux --project-name orgpad --org dev.orgpad .

      - run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Package
        run: |
          mkdir -p dist/orgpad
          cp -r build/linux/x64/release/bundle/. dist/orgpad/
          cp install.sh dist/orgpad/
          tar -C dist -czf orgpad-linux-x64.tar.gz orgpad

      - uses: actions/upload-artifact@v4
        with:
          name: orgpad-linux-x64
          path: orgpad-linux-x64.tar.gz

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest orgpad-linux-x64.tar.gz \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"

      - name: Analyze
        if: always()
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        if: always()
        run: flutter test
