name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Generate Linux runner
        run: |
          flutter create --platforms=linux --project-name haruspex --org io.github.vylca .
          bash tool/patch_runner.sh

      - run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter --version | tee ci.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Build
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee -a ci.log

      - name: Package
        run: |
          mkdir -p dist/haruspex
          cp -r build/linux/x64/release/bundle/. dist/haruspex/
          cp install.sh dist/haruspex/
          tar -C dist -czf haruspex-linux-x64.tar.gz haruspex

      - uses: actions/upload-artifact@v4
        with:
          name: haruspex-linux-x64
          path: haruspex-linux-x64.tar.gz

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a ci.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-linux
          path: ci.log

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate macOS runner
        run: |
          flutter create --platforms=macos --project-name haruspex --org io.github.vylca .
          bash tool/patch_macos.sh

      - run: flutter pub get

      - name: Build
        run: |
          set -o pipefail
          flutter --version | tee ci-macos.log
          flutter build macos --release 2>&1 | tee -a ci-macos.log

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Haruspex.app haruspex-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: haruspex-macos
          path: haruspex-macos.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-macos
          path: ci-macos.log

  # The latest release gets the Linux build once it passed its tests, and
  # the Mac build when it built.
  release:
    needs: [linux, macos]
    if: always() && github.ref == 'refs/heads/main' && needs.linux.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: haruspex-*
          merge-multiple: true
          path: dist

      - name: Publish as the latest release
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"

  logs:
    needs: [linux, macos]
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          merge-multiple: true
          path: logs

      - name: Publish the build logs
        run: |
          touch logs/ci.log logs/ci-macos.log
          gh release delete ci-log --yes --cleanup-tag || true
          gh release create ci-log logs/ci.log logs/ci-macos.log \
            --prerelease \
            --title "Build log" \
            --notes "Logs of the last build, ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
